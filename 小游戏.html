<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <title>爱吃辣 - 像素冒险</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            touch-action: manipulation;
            overscroll-behavior: none;
            margin: 0;
        }

        .game-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(255, 100, 100, 0.3), 0 0 80px rgba(255, 150, 50, 0.15);
            background: #87CEEB;
        }

        .controls {
            position: absolute;
            pointer-events: none;
            z-index: 10;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .btn {
            position: absolute;
            pointer-events: auto;
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            background: rgba(30, 30, 50, 0.7);
            color: white;
            font-size: 26px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            touch-action: none;
            z-index: 20;
        }

        .btn:active,
        .btn.pressed {
            background: rgba(255, 150, 100, 0.8);
            border-color: rgba(255, 255, 255, 0.9);
            transform: scale(0.9);
            box-shadow: 0 2px 8px rgba(255, 100, 50, 0.6);
        }

        .btn-left {
            bottom: 8%;
            left: 5%;
            width: 64px;
            height: 64px;
        }

        .btn-right {
            bottom: 8%;
            left: 22%;
            width: 64px;
            height: 64px;
        }

        .btn-jump {
            bottom: 28%;
            right: 5%;
            width: 60px;
            height: 60px;
            font-size: 20px;
            background: rgba(30, 80, 50, 0.75);
            border-color: rgba(100, 255, 150, 0.6);
        }

        .btn-attack {
            bottom: 8%;
            right: 5%;
            width: 74px;
            height: 74px;
            font-size: 30px;
            background: rgba(120, 30, 30, 0.8);
            border-color: rgba(255, 150, 100, 0.7);
            box-shadow: 0 0 25px rgba(255, 80, 50, 0.5);
        }

        .btn-attack:active,
        .btn-attack.pressed {
            background: rgba(255, 80, 40, 0.9);
            border-color: rgba(255, 255, 200, 1);
            box-shadow: 0 0 40px rgba(255, 100, 50, 0.8);
            transform: scale(0.85);
        }

        .btn span {
            pointer-events: none;
            line-height: 1;
        }

        .attack-icon {
            font-size: 28px;
            pointer-events: none;
        }

        @media (max-width: 400px) {
            .btn-left {
                width: 54px;
                height: 54px;
                left: 3%;
                font-size: 20px;
            }
            .btn-right {
                width: 54px;
                height: 54px;
                left: 19%;
                font-size: 20px;
            }
            .btn-jump {
                width: 50px;
                height: 50px;
                right: 3%;
                font-size: 16px;
            }
            .btn-attack {
                width: 62px;
                height: 62px;
                right: 3%;
                font-size: 24px;
            }
        }

        @media (max-height: 600px) {
            .btn-left {
                bottom: 5%;
                width: 48px;
                height: 48px;
                font-size: 18px;
            }
            .btn-right {
                bottom: 5%;
                width: 48px;
                height: 48px;
                font-size: 18px;
                left: 18%;
            }
            .btn-jump {
                bottom: 22%;
                width: 44px;
                height: 44px;
                font-size: 14px;
                right: 3%;
            }
            .btn-attack {
                bottom: 5%;
                width: 56px;
                height: 56px;
                right: 3%;
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="game-wrapper" id="gameWrapper">
        <canvas id="gameCanvas"></canvas>
        <div class="controls" id="controls" style="display: none;">
            <div class="btn btn-left" id="btnLeft"><span>◀</span></div>
            <div class="btn btn-right" id="btnRight"><span>▶</span></div>
            <div class="btn btn-jump" id="btnJump"><span>⬆跳</span></div>
            <div class="btn btn-attack" id="btnAttack"><span class="attack-icon">⚔️</span></div>
        </div>
    </div>

    <script>
        (function() {
            // ==================== 画布设置 ====================
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const wrapper = document.getElementById('gameWrapper');
            const controlsDiv = document.getElementById('controls');

            const LOGICAL_W = 400;
            const LOGICAL_H = 650;
            canvas.width = LOGICAL_W;
            canvas.height = LOGICAL_H;

            function resizeCanvas() {
                const wrapperW = wrapper.clientWidth;
                const wrapperH = wrapper.clientHeight;
                const ratio = LOGICAL_W / LOGICAL_H;
                let w, h;
                if (wrapperW / wrapperH > ratio) {
                    h = wrapperH;
                    w = h * ratio;
                } else {
                    w = wrapperW;
                    h = w / ratio;
                }
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // ==================== 游戏状态 ====================
            const GROUND_Y = 560;
            const GRAVITY = 0.55;
            const PLAYER_SPEED = 2.8;
            const JUMP_FORCE = -9.5;
            const ATTACK_RANGE = 45;
            const ATTACK_COOLDOWN = 22;
            const ATTACK_ACTIVE_FRAMES = 8;
            const MONSTER_SPEED = 0.4;  // 降低怪物速度
            const MONSTER_COUNT_TARGET = 3;
            const WIN_COUNT = 10;
            const COIN_DROP_INTERVAL = 90;

            let gameState = 'start'; // 'start' | 'playing' | 'win'
            let defeatedCount = 0;
            let coinsCollected = 0;
            let frameCount = 0;
            let coinDropTimer = 0;
            let monsters = [];
            let coins = [];
            let particles = [];
            let floatingTexts = [];
            let attackFlash = null;
            let winAnimationTimer = 0;
            let shakeAmount = 0;

            // ==================== 玩家 ====================
            const player = {
                x: 180,
                y: GROUND_Y - 36,
                w: 26,
                h: 36,
                vx: 0,
                vy: 0,
                facing: 1, // 1 = right, -1 = left
                onGround: true,
                attackTimer: 0,
                attackCooldown: 0,
                isAttacking: false,
                attackFrame: 0,
                jumpPressed: false,
                moveDir: 0,
                invincibleTimer: 0,
                blinkTimer: 0,
            };

            // ==================== 按钮状态 ====================
            const input = {
                left: false,
                right: false,
                jump: false,
                attack: false,
                attackJustPressed: false,
                jumpJustPressed: false,
            };

            // ==================== 按钮事件绑定 ====================
            function setupButton(id, key, isAttack = false) {
                const btn = document.getElementById(id);
                if (!btn) return;

                function press(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    if (key === 'attack') {
                        if (!input.attack) {
                            input.attackJustPressed = true;
                        }
                        input.attack = true;
                    } else if (key === 'jump') {
                        if (!input.jump) {
                            input.jumpJustPressed = true;
                        }
                        input.jump = true;
                    } else {
                        input[key] = true;
                    }
                    btn.classList.add('pressed');
                }

                function release(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    if (key === 'attack') {
                        input.attack = false;
                    } else if (key === 'jump') {
                        input.jump = false;
                    } else {
                        input[key] = false;
                    }
                    btn.classList.remove('pressed');
                }

                btn.addEventListener('touchstart', press, { passive: false });
                btn.addEventListener('touchend', release, { passive: false });
                btn.addEventListener('touchcancel', release, { passive: false });
                btn.addEventListener('mousedown', press);
                btn.addEventListener('mouseup', release);
                btn.addEventListener('mouseleave', release);
            }

            setupButton('btnLeft', 'left');
            setupButton('btnRight', 'right');
            setupButton('btnJump', 'jump');
            setupButton('btnAttack', 'attack', true);

            // 键盘控制（用于调试）
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a') input.left = true;
                if (e.key === 'ArrowRight' || e.key === 'd') input.right = true;
                if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') {
                    if (!input.jump) input.jumpJustPressed = true;
                    input.jump = true;
                }
                if (e.key === 'j' || e.key === 'z' || e.key === 'k') {
                    if (!input.attack) input.attackJustPressed = true;
                    input.attack = true;
                }
                e.preventDefault();
            });
            document.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a') input.left = false;
                if (e.key === 'ArrowRight' || e.key === 'd') input.right = false;
                if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') input.jump = false;
                if (e.key === 'j' || e.key === 'z' || e.key === 'k') input.attack = false;
            });

            // ==================== 怪物类 ====================
            const MONSTER_TYPES = [
                { label: '烦', color: '#ff4444', bgColor: '#440000' },
                { label: '加班', color: '#4488ff', bgColor: '#001144' },
                { label: '应酬', color: '#cc44ff', bgColor: '#220044' },
            ];

            class Monster {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.w = 32;  // 增大碰撞箱
                    this.h = 44;
                    this.vx = (Math.random() > 0.5 ? 1 : -1) * MONSTER_SPEED;
                    this.vy = 0;
                    this.type = MONSTER_TYPES[Math.floor(Math.random() * MONSTER_TYPES.length)];
                    this.alive = true;
                    this.flying = false;
                    this.flyVx = 0;
                    this.flyVy = 0;
                    this.flyRotation = 0;
                    this.flyTimer = 0;
                    this.walkFrame = Math.floor(Math.random() * 20);
                    this.onGround = true;
                    this.spawnDelay = 0;
                }

                update() {
                    if (!this.alive) return;

                    if (this.flying) {
                        this.flyTimer--;
                        this.x += this.flyVx;
                        this.vy += GRAVITY * 0.7;
                        this.y += this.vy;
                        this.flyRotation += 0.25;
                        if (this.flyTimer <= 0 || this.y > GROUND_Y + 150) {
                            this.alive = false;
                        }
                        return;
                    }

                    this.walkFrame++;
                    this.x += this.vx;

                    // 边界反弹
                    if (this.x < 10) { this.x = 10;
                        this.vx = Math.abs(this.vx); }
                    if (this.x + this.w > LOGICAL_W - 10) {
                        this.x = LOGICAL_W - 10 - this.w;
                        this.vx = -Math.abs(this.vx);
                    }

                    // 重力
                    if (!this.onGround) {
                        this.vy += GRAVITY;
                        this.y += this.vy;
                        if (this.y >= GROUND_Y - this.h) {
                            this.y = GROUND_Y - this.h;
                            this.vy = 0;
                            this.onGround = true;
                        }
                    } else {
                        this.y = GROUND_Y - this.h;
                    }
                }

                getHit(direction) {
                    if (this.flying || !this.alive) return;
                    this.flying = true;
                    this.flyVx = direction * 6;
                    this.vy = -7;
                    this.flyTimer = 45;
                    this.vx = 0;
                    spawnHitParticles(this.x + this.w / 2, this.y + this.h / 2);
                    spawnFloatingText(this.x + this.w / 2, this.y - 10, this.type.label + ' 飞了!', '#ffcc00');
                    shakeAmount = 8;
                }
            }

            // ==================== 金币类 ====================
            const COIN_TYPES = [
                { label: '变美', color: '#ff88cc', glowColor: '#ffbbdd' },
                { label: '暴富', color: '#ffcc00', glowColor: '#ffee88' },
            ];

            class Coin {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.w = 30;
                    this.h = 30;
                    this.vy = 1.2;
                    this.type = COIN_TYPES[Math.floor(Math.random() * COIN_TYPES.length)];
                    this.alive = true;
                    this.bobPhase = Math.random() * Math.PI * 2;
                    this.glowPhase = Math.random() * Math.PI * 2;
                }

                update() {
                    this.y += this.vy;
                    this.bobPhase += 0.06;
                    this.glowPhase += 0.08;
                    if (this.y > GROUND_Y + 40) {
                        this.alive = false;
                    }
                }
            }

            // ==================== 粒子系统 ====================
            function spawnHitParticles(x, y) {
                for (let i = 0; i < 14; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 2 + Math.random() * 4;
                    particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 30 + Math.random() * 20,
                        maxLife: 50,
                        size: 2 + Math.random() * 3,
                        color: ['#ff6666', '#ffcc00', '#ffffff', '#ff9944'][Math.floor(Math.random() * 4)],
                        type: 'spark',
                    });
                }
            }

            function spawnCoinCollectParticles(x, y, color) {
                for (let i = 0; i < 12; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 1.5 + Math.random() * 3;
                    particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - 1,
                        life: 25 + Math.random() * 15,
                        maxLife: 40,
                        size: 2 + Math.random() * 3,
                        color: color,
                        type: 'coin',
                    });
                }
            }

            function spawnFloatingText(x, y, text, color) {
                floatingTexts.push({
                    x: x,
                    y: y,
                    text: text,
                    color: color,
                    life: 45,
                    maxLife: 45,
                    vy: -1.8,
                });
            }

            function spawnAttackFlash(x, y, direction, range) {
                attackFlash = {
                    x: x,
                    y: y,
                    direction: direction,
                    range: range,
                    life: ATTACK_ACTIVE_FRAMES,
                    maxLife: ATTACK_ACTIVE_FRAMES,
                };
            }

            // ==================== 初始化怪物 ====================
            function spawnMonster() {
                const x = 40 + Math.random() * (LOGICAL_W - 80);
                const m = new Monster(x, GROUND_Y - 44);
                monsters.push(m);
            }

            function initMonsters() {
                for (let i = 0; i < MONSTER_COUNT_TARGET; i++) {
                    spawnMonster();
                }
            }

            function spawnCoin() {
                const x = 25 + Math.random() * (LOGICAL_W - 50);
                const c = new Coin(x, -30);
                coins.push(c);
            }

            // ==================== 重置游戏 ====================
            function resetGame() {
                gameState = 'playing';
                defeatedCount = 0;
                coinsCollected = 0;
                frameCount = 0;
                coinDropTimer = 0;
                monsters = [];
                coins = [];
                particles = [];
                floatingTexts = [];
                attackFlash = null;
                shakeAmount = 0;
                winAnimationTimer = 0;
                player.x = 180;
                player.y = GROUND_Y - 36;
                player.vx = 0;
                player.vy = 0;
                player.facing = 1;
                player.onGround = true;
                player.attackTimer = 0;
                player.attackCooldown = 0;
                player.isAttacking = false;
                player.invincibleTimer = 0;
                initMonsters();
                controlsDiv.style.display = 'block';
            }

            // ==================== 碰撞检测 ====================
            function rectCollide(a, b) {
                return a.x < b.x + b.w && a.x + a.w > b.x &&
                    a.y < b.y + b.h && a.y + a.h > b.y;
            }

            // ==================== 更新逻辑 ====================
            function update() {
                if (gameState === 'start') {
                    // 开始界面动画粒子
                    frameCount++;
                    updateParticles();
                    updateFloatingTexts();
                    return;
                }

                if (gameState === 'win') {
                    winAnimationTimer++;
                    updateParticles();
                    updateFloatingTexts();
                    return;
                }

                // ---- playing 状态 ----
                frameCount++;

                if (shakeAmount > 0) shakeAmount *= 0.85;
                if (shakeAmount < 0.1) shakeAmount = 0;

                // 玩家移动
                player.moveDir = 0;
                if (input.left) player.moveDir = -1;
                if (input.right) player.moveDir = 1;
                if (player.moveDir !== 0) {
                    player.facing = player.moveDir;
                }
                player.vx = player.moveDir * PLAYER_SPEED;
                player.x += player.vx;
                if (player.x < 5) player.x = 5;
                if (player.x + player.w > LOGICAL_W - 5) player.x = LOGICAL_W - 5 - player.w;

                // 跳跃
                if (input.jumpJustPressed && player.onGround) {
                    player.vy = JUMP_FORCE;
                    player.onGround = false;
                    input.jumpJustPressed = false;
                }
                if (input.jumpJustPressed) input.jumpJustPressed = false;

                if (!player.onGround) {
                    player.vy += GRAVITY;
                    player.y += player.vy;
                    if (player.y >= GROUND_Y - player.h) {
                        player.y = GROUND_Y - player.h;
                        player.vy = 0;
                        player.onGround = true;
                    }
                }

                // 攻击
                if (player.attackCooldown > 0) player.attackCooldown--;
                if (input.attackJustPressed && player.attackCooldown <= 0 && !player.isAttacking) {
                    player.isAttacking = true;
                    player.attackTimer = ATTACK_ACTIVE_FRAMES;
                    player.attackCooldown = ATTACK_COOLDOWN;
                    player.attackFrame = 0;
                    input.attackJustPressed = false;

                    const attackX = player.facing > 0 ? player.x + player.w : player.x - ATTACK_RANGE;
                    const attackY = player.y + 5;
                    const attackW = ATTACK_RANGE;
                    const attackH = player.h - 10;
                    const attackRect = { x: attackX, y: attackY, w: attackW, h: attackH };

                    for (let m of monsters) {
                        if (!m.alive || m.flying) continue;
                        const mRect = { x: m.x, y: m.y, w: m.w, h: m.h };
                        if (rectCollide(attackRect, mRect)) {
                            m.getHit(player.facing);
                            defeatedCount++;
                            spawnFloatingText(player.x + player.w / 2, player.y - 20,
                                '击败! ' + defeatedCount + '/' + WIN_COUNT, '#ffdd00');
                            if (defeatedCount >= WIN_COUNT) {
                                gameState = 'win';
                                winAnimationTimer = 0;
                                controlsDiv.style.display = 'none';
                                for (let i = 0; i < 60; i++) {
                                    const angle = Math.random() * Math.PI * 2;
                                    const speed = 3 + Math.random() * 5;
                                    particles.push({
                                        x: player.x + player.w / 2 + (Math.random() - 0.5) * 80,
                                        y: player.y + (Math.random() - 0.5) * 60,
                                        vx: Math.cos(angle) * speed,
                                        vy: Math.sin(angle) * speed - 2,
                                        life: 40 + Math.random() * 30,
                                        maxLife: 70,
                                        size: 3 + Math.random() * 4,
                                        color: ['#ff6699', '#ffcc00', '#66ff99', '#66ccff', '#ff9966'][Math.floor(Math
                                            .random() * 5)],
                                        type: 'win',
                                    });
                                }
                            }
                        }
                    }

                    spawnAttackFlash(
                        player.facing > 0 ? player.x + player.w : player.x - ATTACK_RANGE,
                        player.y + 2,
                        player.facing,
                        ATTACK_RANGE
                    );
                }
                if (player.isAttacking) {
                    player.attackTimer--;
                    player.attackFrame++;
                    if (player.attackTimer <= 0) {
                        player.isAttacking = false;
                    }
                }
                if (input.attackJustPressed) input.attackJustPressed = false;

                // 更新怪物
                for (let m of monsters) {
                    m.update();
                }
                monsters = monsters.filter(m => m.alive);

                while (monsters.filter(m => !m.flying && m.alive).length < MONSTER_COUNT_TARGET &&
                    monsters.length < MONSTER_COUNT_TARGET + 2) {
                    const x = 50 + Math.random() * (LOGICAL_W - 100);
                    const m = new Monster(x, GROUND_Y - 44);
                    m.spawnDelay = 20;
                    monsters.push(m);
                }

                // 玩家与怪物碰撞
                for (let m of monsters) {
                    if (!m.alive || m.flying) continue;
                    if (rectCollide(player, m)) {
                        const pushDir = (player.x + player.w / 2) > (m.x + m.w / 2) ? 1 : -1;
                        player.x += pushDir * 8;
                        player.x = Math.max(5, Math.min(LOGICAL_W - 5 - player.w, player.x));
                        if (player.onGround) {
                            player.vy = -4;
                            player.onGround = false;
                        }
                    }
                }

                // 金币生成
                coinDropTimer++;
                const dropInterval = Math.max(50, COIN_DROP_INTERVAL - defeatedCount * 2);
                if (coinDropTimer >= dropInterval) {
                    coinDropTimer = 0;
                    spawnCoin();
                    if (Math.random() > 0.7 && coins.length < 5) {
                        spawnCoin();
                    }
                }

                // 更新金币
                for (let c of coins) c.update();
                for (let c of coins) {
                    if (c.alive && rectCollide(player, c)) {
                        c.alive = false;
                        coinsCollected++;
                        spawnCoinCollectParticles(c.x + c.w / 2, c.y + c.h / 2, c.type.color);
                        spawnFloatingText(c.x + c.w / 2, c.y - 15, c.type.label + ' +1', c.type.color);
                    }
                }
                coins = coins.filter(c => c.alive);

                updateParticles();
                updateFloatingTexts();

                if (attackFlash) {
                    attackFlash.life--;
                    if (attackFlash.life <= 0) attackFlash = null;
                }
            }

            function updateParticles() {
                for (let p of particles) {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.15;
                    p.life--;
                }
                particles = particles.filter(p => p.life > 0);
            }

            function updateFloatingTexts() {
                for (let ft of floatingTexts) {
                    ft.y += ft.vy;
                    ft.life--;
                }
                floatingTexts = floatingTexts.filter(ft => ft.life > 0);
            }

            // ==================== 绘制函数 ====================
            function drawPixelRect(x, y, w, h, color) {
                ctx.fillStyle = color;
                ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
            }

            function drawPixelCharacter(x, y, w, h, isPlayer, facing, walkFrame, attackFrame, isAttacking, monster) {
                if (isPlayer) {
                    // 玩家"爱吃辣"
                    drawPixelRect(x + 4, y + 12, 18, 14, '#cc2222');
                    drawPixelRect(x + 6, y + 10, 14, 4, '#ee4444');
                    drawPixelRect(x + 6, y + 26, 7, 8, '#333355');
                    drawPixelRect(x + 13, y + 26, 7, 8, '#333355');
                    drawPixelRect(x + 4, y + 33, 8, 3, '#553322');
                    drawPixelRect(x + 14, y + 33, 8, 3, '#553322');
                    drawPixelRect(x + 6, y + 2, 14, 10, '#ffcc99');
                    drawPixelRect(x + 4, y, 18, 4, '#ff2222');
                    drawPixelRect(x + 2, y + 2, 4, 6, '#ff2222');
                    drawPixelRect(x + 20, y + 2, 4, 6, '#ff2222');
                    drawPixelRect(x + 6, y + 2, 14, 2, '#ff4444');
                    const eyeY = y + 6;
                    if (facing > 0) {
                        drawPixelRect(x + 16, eyeY, 4, 3, '#222222');
                        drawPixelRect(x + 18, eyeY, 2, 2, '#ffffff');
                    } else {
                        drawPixelRect(x + 6, eyeY, 4, 3, '#222222');
                        drawPixelRect(x + 6, eyeY, 2, 2, '#ffffff');
                    }
                    drawPixelRect(x + 11, y + 10, 5, 2, '#cc6644');
                    if (isAttacking && attackFrame < 4) {
                        const punchX = facing > 0 ? x + w : x - 8;
                        drawPixelRect(punchX, y + 14, 8, 6, '#ff9966');
                        drawPixelRect(punchX + (facing > 0 ? 6 : 0), y + 12, 4, 10, '#ffcc99');
                    }
                    if (!isAttacking && walkFrame % 20 < 10 && player.moveDir !== 0) {
                        drawPixelRect(x + 4, y + 34, 7, 2, '#553322');
                        drawPixelRect(x + 15, y + 34, 7, 2, '#553322');
                    }
                    drawPixelRect(x + 1, y + 8, 3, 5, '#33cc33');
                    drawPixelRect(x + 2, y + 8, 2, 2, '#44dd44');
                } else {
                    // 怪物 - 小黑人（头部更大）
                    const bw = w;
                    const bh = h;
                    // 身体 (较瘦)
                    drawPixelRect(x + 6, y + 20, bw - 12, 18, '#1a1a1a');
                    drawPixelRect(x + 8, y + 18, bw - 16, 4, '#222222');
                    // 裤子
                    drawPixelRect(x + 8, y + 32, 6, 8, '#111111');
                    drawPixelRect(x + bw - 14, y + 32, 6, 8, '#111111');
                    // 鞋子
                    drawPixelRect(x + 6, y + 38, 9, 4, '#333333');
                    drawPixelRect(x + bw - 15, y + 38, 9, 4, '#333333');
                    // 大脑袋 (占据更多空间)
                    const headW = bw - 8; // 头部几乎与身体同宽
                    const headH = 20;
                    const headX = x + (bw - headW) / 2;
                    const headY = y;
                    drawPixelRect(headX, headY, headW, headH, '#1a1a1a');
                    drawPixelRect(headX + 2, headY + 2, headW - 4, headH - 4, '#0f0f0f');
                    // 红色眼睛
                    const eyeY = headY + 6;
                    const eyeSize = 5;
                    if (facing > 0) {
                        drawPixelRect(headX + headW - 12, eyeY, eyeSize, eyeSize, '#ff3333');
                        drawPixelRect(headX + headW - 10, eyeY + 1, 2, 2, '#ff8888');
                    } else {
                        drawPixelRect(headX + 7, eyeY, eyeSize, eyeSize, '#ff3333');
                        drawPixelRect(headX + 7, eyeY + 1, 2, 2, '#ff8888');
                    }
                    // 嘴巴
                    drawPixelRect(headX + headW / 2 - 3, headY + 14, 6, 2, '#333333');
                    // 头顶标签（清晰黑体）
                    if (monster && monster.type) {
                        const labelX = x + w / 2 - 30;
                        const labelY = y - 22;
                        drawPixelRect(labelX - 4, labelY - 4, 68, 26, monster.type.bgColor);
                        drawPixelRect(labelX - 4, labelY - 4, 68, 3, '#ffffff55');
                        drawPixelRect(labelX - 4, labelY + 19, 68, 3, '#00000055');
                        ctx.fillStyle = monster.type.color;
                        ctx.font = 'bold 16px "SimHei", "黑体", "Heiti SC", "Microsoft YaHei", sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText(monster.type.label, x + w / 2, labelY + 14);
                        ctx.textAlign = 'left';
                    }
                }
            }

            function drawCoin(coin) {
                const cx = coin.x + coin.w / 2;
                const cy = coin.y + coin.h / 2;
                const radius = coin.w / 2;
                const bobOffset = Math.sin(coin.bobPhase) * 2;
                const drawY = cy + bobOffset;
                const glowSize = 2 + Math.sin(coin.glowPhase) * 1.5;
                ctx.globalAlpha = 0.25;
                drawPixelRect(cx - radius - glowSize, drawY - radius - glowSize,
                    radius * 2 + glowSize * 2, radius * 2 + glowSize * 2, coin.type.glowColor);
                ctx.globalAlpha = 1;
                drawPixelRect(cx - radius, drawY - radius, radius * 2, radius * 2, '#cc9900');
                drawPixelRect(cx - radius + 2, drawY - radius + 2, radius * 2 - 4, radius * 2 - 4, '#ffcc00');
                drawPixelRect(cx - radius + 5, drawY - radius + 5, radius * 2 - 10, radius * 2 - 10, '#ffdd33');
                drawPixelRect(cx - radius + 6, drawY - radius + 4, 8, 3, '#ffffee');
                drawPixelRect(cx - radius + 5, drawY - radius + 6, 3, 8, '#ffffee');
                drawPixelRect(cx - radius + 1, drawY - radius + 1, radius * 2 - 2, 2, '#aa7700');
                drawPixelRect(cx - radius + 1, drawY + radius - 3, radius * 2 - 2, 2, '#aa7700');
                ctx.fillStyle = '#553300';
                ctx.font = 'bold 8px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText(coin.type.label, cx, drawY + 3);
                ctx.textAlign = 'left';
            }

            function drawBackground() {
                const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
                grad.addColorStop(0, '#87CEEB');
                grad.addColorStop(0.5, '#b5dffa');
                grad.addColorStop(1, '#e8f4ff');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, LOGICAL_W, GROUND_Y);
                const cloudY1 = 60 + Math.sin(frameCount * 0.008) * 10;
                const cloudY2 = 120 + Math.cos(frameCount * 0.006) * 8;
                const cloudY3 = 40 + Math.sin(frameCount * 0.01 + 2) * 12;
                drawCloud(60, cloudY1, 0.9);
                drawCloud(280, cloudY2, 1.1);
                drawCloud(180, cloudY3, 0.7);
                ctx.fillStyle = '#aaccee';
                ctx.beginPath();
                ctx.moveTo(0, GROUND_Y - 60);
                ctx.quadraticCurveTo(80, GROUND_Y - 130, 160, GROUND_Y - 55);
                ctx.quadraticCurveTo(240, GROUND_Y - 120, 320, GROUND_Y - 50);
                ctx.quadraticCurveTo(370, GROUND_Y - 90, LOGICAL_W, GROUND_Y - 55);
                ctx.lineTo(LOGICAL_W, GROUND_Y);
                ctx.lineTo(0, GROUND_Y);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#7a5c3a';
                ctx.fillRect(0, GROUND_Y, LOGICAL_W, LOGICAL_H - GROUND_Y);
                for (let i = 0; i < LOGICAL_W; i += 12) {
                    const h = 3 + Math.sin(i * 0.5) * 2;
                    drawPixelRect(i, GROUND_Y + 2, 8, h, '#8a6c4a');
                }
                ctx.fillStyle = '#4a8a3a';
                ctx.fillRect(0, GROUND_Y - 2, LOGICAL_W, 5);
                for (let i = 4; i < LOGICAL_W - 4; i += 10) {
                    drawPixelRect(i, GROUND_Y - 6, 4, 5, '#5a9a4a');
                }
                drawPixelRect(35, GROUND_Y - 4, 6, 4, '#999999');
                drawPixelRect(120, GROUND_Y - 3, 5, 3, '#aaaaaa');
                drawPixelRect(290, GROUND_Y - 5, 7, 4, '#888888');
                drawPixelRect(340, GROUND_Y - 3, 4, 3, '#999999');
            }

            function drawCloud(x, y, scale) {
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                const s = scale;
                ctx.fillRect(x, y, 40 * s, 16 * s);
                ctx.fillRect(x + 8 * s, y - 10 * s, 28 * s, 14 * s);
                ctx.fillRect(x + 16 * s, y - 16 * s, 16 * s, 12 * s);
                ctx.fillRect(x + 24 * s, y - 6 * s, 14 * s, 10 * s);
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.fillRect(x + 6 * s, y + 3 * s, 12 * s, 5 * s);
            }

            function drawHUD() {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(8, 8, 110, 40);
                ctx.strokeStyle = '#ffcc00';
                ctx.lineWidth = 2;
                ctx.strokeRect(8, 8, 110, 40);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px "Courier New", monospace';
                ctx.fillText('击败: ' + defeatedCount + '/' + WIN_COUNT, 16, 26);
                ctx.fillStyle = '#ffcc00';
                ctx.fillText('金币: ' + coinsCollected, 16, 42);
                const progress = Math.min(defeatedCount / WIN_COUNT, 1);
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fillRect(8, 50, 110, 8);
                ctx.fillStyle = '#ffcc00';
                ctx.fillRect(8, 50, 110 * progress, 8);
                ctx.strokeStyle = '#ffffff55';
                ctx.lineWidth = 1;
                ctx.strokeRect(8, 50, 110, 8);
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(LOGICAL_W - 100, 8, 92, 22);
                ctx.fillStyle = '#ff4444';
                ctx.font = 'bold 10px "Courier New", monospace';
                ctx.fillText('🌶️ 爱吃辣', LOGICAL_W - 92, 23);
            }

            function drawAttackEffect() {
                if (!attackFlash) return;
                const alpha = attackFlash.life / attackFlash.maxLife;
                ctx.globalAlpha = alpha * 0.7;
                const fx = attackFlash.x;
                const fy = attackFlash.y;
                const fr = attackFlash.range;
                const fh = 28;
                const grad = ctx.createLinearGradient(
                    attackFlash.direction > 0 ? fx : fx + fr,
                    fy,
                    attackFlash.direction > 0 ? fx + fr : fx,
                    fy + fh
                );
                grad.addColorStop(0, 'rgba(255,255,200,0.9)');
                grad.addColorStop(0.5, 'rgba(255,200,80,0.6)');
                grad.addColorStop(1, 'rgba(255,100,50,0.1)');
                ctx.fillStyle = grad;
                ctx.fillRect(fx, fy, fr, fh);
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                if (attackFlash.direction > 0) {
                    ctx.fillRect(fx + fr - 6, fy, 6, fh);
                } else {
                    ctx.fillRect(fx, fy, 6, fh);
                }
                ctx.globalAlpha = 1;
            }

            function drawParticles() {
                for (let p of particles) {
                    ctx.globalAlpha = p.life / p.maxLife;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
                }
                ctx.globalAlpha = 1;
            }

            function drawFloatingTexts() {
                for (let ft of floatingTexts) {
                    ctx.globalAlpha = ft.life / ft.maxLife;
                    ctx.fillStyle = ft.color;
                    ctx.font = 'bold 11px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(ft.text, ft.x, ft.y);
                    ctx.textAlign = 'left';
                }
                ctx.globalAlpha = 1;
            }

            function drawStartScreen() {
                // 背景
                drawBackground();

                // 标题
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(50, 100, 300, 80);
                ctx.fillStyle = '#ffdd00';
                ctx.font = 'bold 34px "SimHei", "黑体", "Microsoft YaHei", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('🌶️ 爱吃辣', LOGICAL_W / 2, 145);
                ctx.font = 'bold 18px "SimHei", "黑体", sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.fillText('像素冒险', LOGICAL_W / 2, 170);
                ctx.textAlign = 'left';

                // 角色预览
                const previewX = LOGICAL_W / 2 - 20;
                const previewY = 240;
                drawPixelCharacter(previewX, previewY, 40, 50, true, 1, 0, 0, false, null);

                // 开始按钮
                const btnX = LOGICAL_W / 2 - 70;
                const btnY = 330;
                const btnW = 140;
                const btnH = 45;
                ctx.fillStyle = '#ff8800';
                ctx.fillRect(btnX, btnY, btnW, btnH);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.strokeRect(btnX, btnY, btnW, btnH);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 22px "SimHei", "黑体", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('开始游戏', LOGICAL_W / 2, btnY + 30);
                ctx.textAlign = 'left';

                // 横屏提示
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 14px "SimHei", "黑体", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('请横屏游玩，体验更佳', LOGICAL_W / 2, 420);
                ctx.textAlign = 'left';

                // 存储按钮区域供点击检测
                window.startBtnRect = { x: btnX, y: btnY, w: btnW, h: btnH };
            }

            function drawWinScreen() {
                ctx.fillStyle = 'rgba(0,0,0,0.75)';
                ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
                ctx.fillStyle = '#ffcc00';
                ctx.font = 'bold 28px "SimHei", "黑体", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('🎉 恭喜通过！🎉', LOGICAL_W / 2, 130);
                ctx.textAlign = 'left';

                const flowerBaseX = LOGICAL_W / 2;
                const flowerBaseY = 280;
                const animProgress = Math.min(winAnimationTimer / 40, 1);
                const scaleIn = 1 + (1 - animProgress) * 0.3;
                const fadeIn = Math.min(winAnimationTimer / 20, 1);
                ctx.globalAlpha = fadeIn;
                ctx.save();
                ctx.translate(flowerBaseX, flowerBaseY);
                ctx.scale(scaleIn, scaleIn);
                drawPixelRect(-18, 10, 36, 30, '#88aacc');
                drawPixelRect(-20, 10, 40, 6, '#6699bb');
                drawPixelRect(-16, 36, 32, 8, '#557799');
                drawPixelRect(-10, 8, 8, 6, '#ff6699');
                drawPixelRect(2, 8, 8, 6, '#ff6699');
                drawPixelRect(-2, 6, 4, 4, '#ff88aa');
                drawPixelRect(-2, -30, 4, 42, '#338833');
                drawPixelRect(-8, -15, 4, 28, '#338833');
                drawPixelRect(4, -20, 4, 30, '#338833');
                drawPixelRect(-10, -10, 7, 4, '#44aa44');
                drawPixelRect(3, -5, 7, 4, '#44aa44');
                drawPixelRect(-14, 0, 6, 3, '#55bb55');
                drawPixelRect(8, -12, 6, 3, '#55bb55');
                const bloomScale = Math.min(winAnimationTimer / 30, 1);
                const flowerOffset = (1 - bloomScale) * -8;
                drawFlower(-2, -28 + flowerOffset, '#ff4466', bloomScale);
                drawFlower(-8, -12 + flowerOffset * 0.5, '#ff88cc', bloomScale * 0.8);
                drawFlower(4, -18 + flowerOffset * 0.7, '#ffcc00', bloomScale * 0.9);
                drawFlower(-14, -4 + flowerOffset * 0.3, '#cc88ff', bloomScale * 0.6);
                drawFlower(6, -2 + flowerOffset * 0.2, '#ff6644', bloomScale * 0.5);
                ctx.restore();
                ctx.globalAlpha = 1;

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 18px "SimHei", "黑体", sans-serif';
                ctx.textAlign = 'center';
                const textY = 370 + Math.sin(winAnimationTimer * 0.05) * 3;
                ctx.fillText('小申希望你每天开心耶 ❤️', LOGICAL_W / 2, textY);
                ctx.textAlign = 'left';

                // 结束按钮
                const btnX = LOGICAL_W / 2 - 70;
                const btnY = 420;
                const btnW = 140;
                const btnH = 45;
                ctx.fillStyle = '#ff4444';
                ctx.fillRect(btnX, btnY, btnW, btnH);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.strokeRect(btnX, btnY, btnW, btnH);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 22px "SimHei", "黑体", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('结束', LOGICAL_W / 2, btnY + 30);
                ctx.textAlign = 'left';
                window.endBtnRect = { x: btnX, y: btnY, w: btnW, h: btnH };

                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(LOGICAL_W / 2 - 80, 490, 160, 30);
                ctx.fillStyle = '#ffcc00';
                ctx.font = 'bold 12px "SimHei", "黑体", sans-serif';
                ctx.fillText('金币收集: ' + coinsCollected + ' 枚', LOGICAL_W / 2, 510);
            }

            function drawFlower(x, y, color, size) {
                const s = size || 1;
                const petalColor = color;
                const centerColor = '#ffdd00';
                drawPixelRect(x - 4 * s, y - 4 * s, 4 * s, 4 * s, petalColor);
                drawPixelRect(x, y - 4 * s, 4 * s, 4 * s, petalColor);
                drawPixelRect(x - 4 * s, y, 4 * s, 4 * s, petalColor);
                drawPixelRect(x, y, 4 * s, 4 * s, petalColor);
                drawPixelRect(x - 6 * s, y - 2 * s, 3 * s, 4 * s, petalColor);
                drawPixelRect(x + 3 * s, y - 2 * s, 3 * s, 4 * s, petalColor);
                drawPixelRect(x - 2 * s, y - 6 * s, 4 * s, 3 * s, petalColor);
                drawPixelRect(x - 2 * s, y + 3 * s, 4 * s, 3 * s, petalColor);
                drawPixelRect(x - 2 * s, y - 2 * s, 4 * s, 4 * s, centerColor);
                drawPixelRect(x - 1 * s, y - 1 * s, 2 * s, 2 * s, '#ffee88');
            }

            // ==================== 主渲染循环 ====================
            function render() {
                ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);

                ctx.save();
                if (shakeAmount > 0.5 && gameState === 'playing') {
                    const sx = (Math.random() - 0.5) * shakeAmount;
                    const sy = (Math.random() - 0.5) * shakeAmount;
                    ctx.translate(sx, sy);
                }

                if (gameState === 'start') {
                    drawStartScreen();
                    drawParticles();
                    drawFloatingTexts();
                } else if (gameState === 'win') {
                    drawBackground();
                    drawParticles();
                    drawFloatingTexts();
                    drawWinScreen();
                } else {
                    // playing
                    drawBackground();
                    for (let c of coins) drawCoin(c);
                    for (let m of monsters) {
                        if (!m.alive) continue;
                        if (m.flying) {
                            ctx.save();
                            ctx.translate(m.x + m.w / 2, m.y + m.h / 2);
                            ctx.rotate(m.flyRotation);
                            ctx.globalAlpha = Math.max(0, m.flyTimer / 45);
                            drawPixelCharacter(-m.w / 2, -m.h / 2, m.w, m.h, false, m.flyVx > 0 ? 1 : -1, 0, 0,
                                false, m);
                            ctx.restore();
                            ctx.globalAlpha = 1;
                        } else {
                            drawPixelCharacter(m.x, m.y, m.w, m.h, false, m.vx > 0 ? 1 : -1, m.walkFrame, 0, false,
                                m);
                        }
                    }
                    const playerBlink = player.invincibleTimer > 0 && Math.floor(player.invincibleTimer / 3) % 2 === 0;
                    if (!playerBlink) {
                        drawPixelCharacter(player.x, player.y, player.w, player.h, true, player.facing,
                            frameCount, player.attackFrame, player.isAttacking);
                    }
                    drawAttackEffect();
                    drawParticles();
                    drawFloatingTexts();
                    drawHUD();
                }

                ctx.restore();
            }

            // ==================== 游戏循环 ====================
            function gameLoop() {
                update();
                render();
                requestAnimationFrame(gameLoop);
            }

            // ==================== 点击/触摸处理（开始、结束按钮） ====================
            function handleCanvasClick(e) {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const scaleX = LOGICAL_W / rect.width;
                const scaleY = LOGICAL_H / rect.height;
                let clientX, clientY;
                if (e.touches) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                const canvasX = (clientX - rect.left) * scaleX;
                const canvasY = (clientY - rect.top) * scaleY;

                if (gameState === 'start' && window.startBtnRect) {
                    const r = window.startBtnRect;
                    if (canvasX >= r.x && canvasX <= r.x + r.w && canvasY >= r.y && canvasY <= r.y + r.h) {
                        resetGame();
                    }
                } else if (gameState === 'win' && window.endBtnRect) {
                    const r = window.endBtnRect;
                    if (canvasX >= r.x && canvasX <= r.x + r.w && canvasY >= r.y && canvasY <= r.y + r.h) {
                        gameState = 'start';
                        defeatedCount = 0;
                        coinsCollected = 0;
                        monsters = [];
                        coins = [];
                        particles = [];
                        floatingTexts = [];
                        attackFlash = null;
                        shakeAmount = 0;
                        winAnimationTimer = 0;
                        controlsDiv.style.display = 'none';
                    }
                }
            }

            canvas.addEventListener('click', handleCanvasClick);
            canvas.addEventListener('touchstart', handleCanvasClick, { passive: false });

            // ==================== 启动游戏 ====================
            controlsDiv.style.display = 'none';
            gameLoop();

            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    input.left = false;
                    input.right = false;
                    input.jump = false;
                    input.attack = false;
                }
            });

            console.log('🎮 游戏已启动！');
            console.log('🌶️ 角色：爱吃辣');
            console.log('👾 击败10个怪物即可通关！');
            console.log('💰 收集金币：变美 & 暴富');
            console.log('❤️ 通关后：小申希望你每天开心耶');
            console.log('📱 请在手机上横屏游玩');
        })();
    </script>
</body>
